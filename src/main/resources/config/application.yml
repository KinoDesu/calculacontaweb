spring:
  main:
    banner-mode: 'console'
  application:
    name: calculaconta
  jpa:
    hibernate:
      ddl-auto: ${DATABASE_DDL_AUTO:update}
    show-sql: false
  datasource:
    url: ${DATABASE_URL:jdbc:mysql://localhost:3306/calculaconta}
    username: ${DATABASE_USER:root}
    password: ${DATABASE_PASSWORD:}
    driver-class-name: ${DATABASE_DRIVER:com.mysql.cj.jdbc.Driver}
    prefix:
      jdbc-url: ${DATABASE_URL:jdbc:mysql://localhost:3306/calculaconta}
  thymeleaf:
    prefix: classpath:/templates/
    suffix: .html
  mvc:
    throw-exception-if-no-handler-found: true
  web:
    resources:
      add-mappings: true

server:
  port: ${PORT:8080}
  servlet:
    context-path: ${CONTEXT_PATH:/bill-calculator}
  max-http-request-header-size: ${REQUEST_HEADER_SIZE:24576}
  tomcat:
    max-http-response-header-size: ${RESPONSE_HEADER_SIZE:24576}

management:
  endpoint:
    health:
      show-details: "ALWAYS"
      probes:
        enabled: true

  health:
    livenessState:
      enabled: true
    readinessState:
      enabled: true

probe:
  liveness-path: ${CONTEXT_PATH}/actuator/health/liveness
  readiness-path: ${CONTEXT_PATH}/actuator/health/readiness
  port: http
  initialDelaySecondsLiveness: 120
  initialDelaySecondsReadness: 120

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:*}

